# Two-stage pipeline: unit (no credentials) / integration (real API).
# Unit stage does NOT inject any credential variables.
#
# Note: the default runner is a shell executor that ignores the `image:`
# directive and ships only Python 3.6 (too old — setuptools>=64 / PEP 517
# builds fail). We download a self-contained CPython tarball from
# python-build-standalone in before_script, mirroring the Go SDK's .go_setup.
#
# Integration credentials: TIGEROPEN_TIGER_ID, TIGEROPEN_PRIVATE_KEY,
# TIGEROPEN_ACCOUNT env vars set in GitLab CI Variables (Protected + Masked).

stages:
  - unit
  - integration

.python_setup: &python_setup
  - |
    PY_MIN_MAJOR=3
    PY_MIN_MINOR=9
    need_download="yes"
    if command -v python3 >/dev/null 2>&1; then
      PY_VER=$(python3 -c 'import sys;print("%d.%d"%(sys.version_info[0],sys.version_info[1]))' 2>/dev/null || echo "0.0")
      PY_MAJOR=$(printf '%s' "$PY_VER" | cut -d. -f1)
      PY_MINOR=$(printf '%s' "$PY_VER" | cut -d. -f2)
      if [ "$PY_MAJOR" -gt "$PY_MIN_MAJOR" ] || { [ "$PY_MAJOR" -eq "$PY_MIN_MAJOR" ] && [ "$PY_MINOR" -ge "$PY_MIN_MINOR" ]; }; then
        echo "Using preinstalled python: $(python3 --version)"
        need_download="no"
      else
        echo "Preinstalled python is ${PY_VER} (< ${PY_MIN_MAJOR}.${PY_MIN_MINOR}), downloading a newer toolchain"
      fi
    else
      echo "python3 not found, downloading a toolchain"
    fi
    if [ "$need_download" = "yes" ]; then
      PY_VERSION="3.11.9"
      PY_RELEASE="20240415"
      ARCH=$(uname -m | sed 's/x86_64/x86_64/; s/aarch64/aarch64/')
      TARBALL="cpython-${PY_VERSION}+${PY_RELEASE}-${ARCH}-unknown-linux-gnu-install_only.tar.gz"
      DOWNLOAD_URL="https://github.com/astral-sh/python-build-standalone/releases/download/${PY_RELEASE}/${TARBALL}"
      # ghproxy.com mirror first (reliable from domestic runner), fallback to GitHub.
      # --fail so a soft-404 / HTML error page triggers the fallback instead of
      # leaving a bogus tarball for `tar` to choke on.
      curl --fail -sSL --retry 3 "https://ghproxy.com/${DOWNLOAD_URL}" -o /tmp/python.tar.gz \
        || curl --fail -sSL --retry 3 "${DOWNLOAD_URL}" -o /tmp/python.tar.gz
      tar -C /tmp -xzf /tmp/python.tar.gz
      export PATH="/tmp/python/bin:${PATH}"
    fi
  - python3 --version
  - python3 -m pip install --quiet --upgrade pip
  - pip install --quiet -e . -i https://pypi.tuna.tsinghua.edu.cn/simple
  - pip install --quiet pytest pytest-cov -i https://pypi.tuna.tsinghua.edu.cn/simple

unit:python:
  stage: unit
  before_script:
    - *python_setup
  script:
    - unset TIGEROPEN_TIGER_ID TIGEROPEN_PRIVATE_KEY TIGEROPEN_ACCOUNT TIGEROPEN_PROPS_PATH
    - pytest tests/ --ignore=tests/integ -q --cov=tigeropen --cov-report=term --cov-report=xml
  coverage: '/^TOTAL.*\s(\d+)%$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

integration:python:
  stage: integration
  allow_failure: true
  variables:
    TIGER_RUN_INTEG: "true"
  before_script:
    - *python_setup
  script:
    - pytest tests/integ/ -v --tb=short

# Pipeline result notification via a generic webhook (Feishu/Lark incoming
# webhook). WEBHOOK_URL is a masked CI Variable set in GitLab Settings; forks
# and PRs that don't configure it skip silently. notify failure never blocks.
notify:webhook:
  stage: .post
  when: always
  allow_failure: true
  dependencies: []
  script:
    - |
      if [ -z "$WEBHOOK_URL" ]; then
        echo "WEBHOOK_URL not configured, skipping notification"
        exit 0
      fi
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      JOBS_JSON=$(curl -sS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${API}/pipelines/${CI_PIPELINE_ID}/jobs" 2>/dev/null || echo "[]")
      # Decide pass/fail from job statuses rather than CI_PIPELINE_STATUS,
      # which may still read "running" in a .post when:always job (GitLab
      # known behaviour). jobs API returns name+status only — no trace/secrets.
      # allow_failure soft-fails don't block the pipeline, so don't list them.
      HAS_FAILED="no"
      FAILED_JOBS=""
      if command -v python3 >/dev/null 2>&1; then
        OUT=$(printf '%s' "$JOBS_JSON" | python3 -c "import sys,json
      try:
        js=json.load(sys.stdin)
        failed=[j['name'] for j in js if j.get('status')=='failed' and not j.get('allow_failure')]
        print('yes' if failed else 'no')
        print(', '.join(failed))
      except Exception:
        print('no'); print('')
      " 2>/dev/null)
        HAS_FAILED=$(printf '%s\n' "$OUT" | sed -n '1p')
        FAILED_JOBS=$(printf '%s\n' "$OUT" | sed -n '2p')
      else
        echo "python3 not found, falling back to CI_PIPELINE_STATUS"
        if [ "$CI_PIPELINE_STATUS" = "failed" ]; then HAS_FAILED="yes"; fi
      fi
      TITLE="✅ Pipeline passed"
      COLOR="green"
      if [ "$HAS_FAILED" = "yes" ]; then
        TITLE="❌ Pipeline failed"
        COLOR="red"
      fi
      CONTENT="**Repo:** ${CI_PROJECT_NAME}\n**Branch:** ${CI_COMMIT_REF_NAME}\n**Commit:** ${CI_COMMIT_SHORT_SHA}\n"
      if [ -n "$FAILED_JOBS" ]; then
        CONTENT="${CONTENT}\n**Failed jobs:** ${FAILED_JOBS}\n"
      fi
      CONTENT="${CONTENT}[View pipeline](${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID})"
      PAYLOAD=$(cat <<EOF
      {
        "msg_type": "interactive",
        "card": {
          "header": {
            "title": {"tag": "plain_text", "content": "$TITLE #${CI_PIPELINE_IID} — ${CI_PROJECT_NAME}"},
            "template": "$COLOR"
          },
          "elements": [
            {"tag": "div", "text": {"tag": "lark_md", "content": "$CONTENT"}}
          ]
        }
      }
      EOF
      )
      curl --fail -sS -X POST "$WEBHOOK_URL" \
        -H 'Content-Type: application/json' \
        -d "$PAYLOAD"
