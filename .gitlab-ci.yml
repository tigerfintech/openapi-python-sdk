# Two-stage pipeline: unit (no credentials) / integration (real API).
# Unit stage does NOT inject any credential variables.

stages:
  - unit
  - integration

# Integration credentials: TIGEROPEN_TIGER_ID, TIGEROPEN_PRIVATE_KEY, TIGEROPEN_ACCOUNT
# env vars set in GitLab CI Variables (Protected + Masked).

.python_base:
  image: python:3.11-slim
  tags:
    - platform-openapi
  before_script:
    - pip install --quiet -e .
    - pip install --quiet pytest pytest-cov

unit:python:
  extends: .python_base
  stage: unit
  script:
    - pytest tests/ --ignore=tests/integ -q --cov=tigeropen --cov-report=term --cov-report=xml
  coverage: '/^TOTAL.*\s(\d+)%$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

integration:python:
  extends: .python_base
  stage: integration
  allow_failure: true
  variables:
    TIGER_RUN_INTEG: "true"
  script:
    - pytest tests/integ/ -v --tb=short
