# Two-stage pipeline: unit (no credentials) / integration (real API).
# Unit stage does NOT inject any credential variables.
#
# Python needs a Docker executor (image: python:3.11-slim) for a modern
# Python; the default shell runner only has python3.6. Register a Docker
# runner tagged 'openapi' for this pipeline.
#
# Integration credentials: TIGEROPEN_TIGER_ID, TIGEROPEN_PRIVATE_KEY,
# TIGEROPEN_ACCOUNT env vars set in GitLab CI Variables (Protected + Masked).

stages:
  - unit
  - integration

.python_base:
  image: python:3.11-slim
  tags:
    - openapi
  before_script:
    - pip install --quiet -e . -i https://pypi.tuna.tsinghua.edu.cn/simple
    - pip install --quiet pytest pytest-cov -i https://pypi.tuna.tsinghua.edu.cn/simple

unit:python:
  extends: .python_base
  stage: unit
  script:
    - unset TIGEROPEN_TIGER_ID TIGEROPEN_PRIVATE_KEY TIGEROPEN_ACCOUNT TIGEROPEN_PROPS_PATH
    - mkdir -p test-results
    - pytest tests/ --ignore=tests/integ -q --cov=tigeropen --cov-report=term --cov-report=xml --junitxml=test-results/unit.xml
  coverage: '/^TOTAL.*\s(\d+)%$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit:
        - test-results/unit.xml
    expire_in: 1 week

integration:python:
  extends: .python_base
  stage: integration
  allow_failure: true
  variables:
    TIGER_RUN_INTEG: "true"
  script:
    - mkdir -p test-results
    - pytest tests/integ/ -v --tb=short --junitxml=test-results/integ.xml
  artifacts:
    when: always
    reports:
      junit:
        - test-results/integ.xml
    expire_in: 1 week

# Pipeline result notification via chat webhook.
# Uses python3 urllib (no curl dependency) for all HTTP calls.
notify:webhook:
  image: python:3.11-slim
  tags:
    - openapi
  stage: .post
  when: always
  allow_failure: true
  dependencies: []
  script:
    - |
      python3 << 'PYEOF'
      import os, json, urllib.request, urllib.error

      webhook_url = os.environ.get("WEBHOOK_URL", "")
      if not webhook_url:
          print("WEBHOOK_URL not configured, skipping notification")
          exit(0)
      card_content_tag = os.environ["CARD_CONTENT_TAG"]

      api_base = os.environ["CI_API_V4_URL"]
      project_id = os.environ["CI_PROJECT_ID"]
      pipeline_id = os.environ["CI_PIPELINE_ID"]
      job_token = os.environ["CI_JOB_TOKEN"]
      headers = {"JOB-TOKEN": job_token}

      # 1. Fetch jobs status
      has_failed = False
      failed_jobs = []
      try:
          url = f"{api_base}/projects/{project_id}/pipelines/{pipeline_id}/jobs"
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=10) as resp:
              jobs = json.loads(resp.read())
              failed_jobs = [j["name"] for j in jobs if j.get("status") == "failed" and not j.get("allow_failure")]
              has_failed = len(failed_jobs) > 0
      except Exception as e:
          print(f"jobs API failed: {e}, falling back to CI_PIPELINE_STATUS")
          status = os.environ.get("CI_PIPELINE_STATUS", "")
          has_failed = status != "success"

      # 2. Fetch test report
      test_stats = ""
      try:
          url = f"{api_base}/projects/{project_id}/pipelines/{pipeline_id}/test_report"
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=10) as resp:
              report = json.loads(resp.read())
              t = report.get("total", {})
              count = t.get("count", 0)
              success = t.get("success", 0)
              failed = t.get("failed", 0)
              skipped = t.get("skipped", 0)
              if count > 0:
                  test_stats = f"{count} tests: {success} passed, {failed} failed, {skipped} skipped"
      except Exception as e:
          print(f"test_report API failed: {e}")

      # 3. Build notification card
      title = "❌ Pipeline failed" if has_failed else "✅ Pipeline passed"
      color = "red" if has_failed else "green"
      project_name = os.environ.get("CI_PROJECT_NAME", "")
      branch = os.environ.get("CI_COMMIT_REF_NAME", "")
      commit = os.environ.get("CI_COMMIT_SHORT_SHA", "")
      pipeline_iid = os.environ.get("CI_PIPELINE_IID", "")
      pipeline_url = os.environ.get("CI_PROJECT_URL", "") + "/-/pipelines/" + os.environ.get("CI_PIPELINE_ID", "")

      content = f"**Repo:** {project_name}\n**Branch:** {branch}\n**Commit:** {commit}\n"
      if failed_jobs:
          content += f"\n**Failed jobs:** {', '.join(failed_jobs)}\n"
      if test_stats:
          content += f"\n**Tests:** {test_stats}\n"
      content += f"[View pipeline]({pipeline_url})"

      payload = {
          "msg_type": "interactive",
          "card": {
              "header": {
                  "title": {"tag": "plain_text", "content": f"{title} #{pipeline_iid} — {project_name}"},
                  "template": color
              },
              "elements": [
                  {"tag": "div", "text": {"tag": card_content_tag, "content": content}}
              ]
          }
      }

      data = json.dumps(payload).encode("utf-8")
      req = urllib.request.Request(webhook_url, data=data, headers={"Content-Type": "application/json"})
      try:
          with urllib.request.urlopen(req, timeout=10) as resp:
              result = json.loads(resp.read())
              print(f"Webhook response: {result}")
      except Exception as e:
          print(f"Webhook request failed: {e}")
      PYEOF
