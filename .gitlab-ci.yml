# Two-stage pipeline: unit (no credentials) / integration (real API).
# Unit stage does NOT inject any credential variables.

stages:
  - unit
  - integration

# Integration credentials: TIGEROPEN_TIGER_ID, TIGEROPEN_PRIVATE_KEY, TIGEROPEN_ACCOUNT
# env vars set in GitLab CI Variables (Protected + Masked).

.python_base:
  image: python:3.11-slim
  tags:
    - platform-openapi
  before_script:
    - pip install --quiet -e .
    - pip install --quiet pytest pytest-cov

unit:python:
  extends: .python_base
  stage: unit
  script:
    - unset TIGEROPEN_TIGER_ID TIGEROPEN_PRIVATE_KEY TIGEROPEN_ACCOUNT TIGEROPEN_PROPS_PATH
    - pytest tests/ --ignore=tests/integ --ignore=tests/test_option_util.py --ignore=tests/test_option_helper.py -q --cov=tigeropen --cov-report=term --cov-report=xml
  coverage: '/^TOTAL.*\s(\d+)%$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

integration:python:
  extends: .python_base
  stage: integration
  allow_failure: true
  variables:
    TIGER_RUN_INTEG: "true"
  script:
    - pytest tests/integ/ -v --tb=short

# Pipeline result notification via a generic webhook (chat incoming
# webhook). WEBHOOK_URL is a masked CI Variable set in GitLab Settings; forks
# and PRs that don't configure it skip silently. notify failure never blocks.
notify:webhook:
  stage: .post
  when: always
  allow_failure: true
  dependencies: []
  script:
    - |
      if [ -z "$WEBHOOK_URL" ]; then
        echo "WEBHOOK_URL not configured, skipping notification"
        exit 0
      fi
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      JOBS_JSON=$(curl -sS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${API}/pipelines/${CI_PIPELINE_ID}/jobs" 2>/dev/null || echo "[]")
      # Decide pass/fail from job statuses rather than CI_PIPELINE_STATUS,
      # which may still read "running" in a .post when:always job (GitLab
      # known behaviour). jobs API returns name+status only — no trace/secrets.
      # allow_failure soft-fails don't block the pipeline, so don't list them.
      HAS_FAILED="no"
      FAILED_JOBS=""
      if command -v python3 >/dev/null 2>&1; then
        OUT=$(printf '%s' "$JOBS_JSON" | python3 -c "import sys,json
      try:
        js=json.load(sys.stdin)
        failed=[j['name'] for j in js if j.get('status')=='failed' and not j.get('allow_failure')]
        print('yes' if failed else 'no')
        print(', '.join(failed))
      except Exception:
        print('no'); print('')
      " 2>/dev/null)
        HAS_FAILED=$(printf '%s\n' "$OUT" | sed -n '1p')
        FAILED_JOBS=$(printf '%s\n' "$OUT" | sed -n '2p')
      else
        echo "python3 not found, falling back to CI_PIPELINE_STATUS"
        if [ "$CI_PIPELINE_STATUS" = "failed" ]; then HAS_FAILED="yes"; fi
      fi
      TITLE="✅ Pipeline passed"
      COLOR="green"
      if [ "$HAS_FAILED" = "yes" ]; then
        TITLE="❌ Pipeline failed"
        COLOR="red"
      fi
      CONTENT="**Repo:** ${CI_PROJECT_NAME}\n**Branch:** ${CI_COMMIT_REF_NAME}\n**Commit:** ${CI_COMMIT_SHORT_SHA}\n"
      if [ -n "$FAILED_JOBS" ]; then
        CONTENT="${CONTENT}\n**Failed jobs:** ${FAILED_JOBS}\n"
      fi
      CONTENT="${CONTENT}[View pipeline](${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID})"
      PAYLOAD=$(cat <<EOF
      {
        "msg_type": "interactive",
        "card": {
          "header": {
            "title": {"tag": "plain_text", "content": "$TITLE #${CI_PIPELINE_IID} — ${CI_PROJECT_NAME}"},
            "template": "$COLOR"
          },
          "elements": [
            {"tag": "div", "text": {"tag": os.environ["CARD_CONTENT_TAG"], "content": "$CONTENT"}}
          ]
        }
      }
      EOF
      )
      curl --fail -sS -X POST "$WEBHOOK_URL" \
        -H 'Content-Type: application/json' \
        -d "$PAYLOAD"
